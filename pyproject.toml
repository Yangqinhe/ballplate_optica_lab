[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ballplate-optical-lab"
version = "0.1.0"
description = "Evidence-first optical platform assessment, before policy retraining"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "matplotlib>=3.5", "scipy>=1.8"]

[project.scripts]
optical-lab = "optical_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
